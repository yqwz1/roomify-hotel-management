services:
  - type: web
    name: roomify-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ROOMIFY_AI_SERVICE_HOST
        fromService:
          type: web
          name: roomify-ai-service
          property: host
      - key: ROOMIFY_AI_SERVICE_PORT
        fromService:
          type: web
          name: roomify-ai-service
          property: port
      - key: ROOMIFY_FRONTEND_URL
        sync: false
      - key: ROOMIFY_CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ROOMIFY_JWT_SECRET
        sync: false
      - key: ROOMIFY_MAIL_FROM
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_SMTP_AUTH
        value: "true"
      - key: SPRING_MAIL_STARTTLS_ENABLE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: ROOMIFY_DEMO_BOOTSTRAP_ENABLED
        value: "false"
      - key: ROOMIFY_AI_FINANCE_DEMO_SEED_ENABLED
        value: "false"
      - key: ROOMIFY_AI_FINANCE_DEMO_SEED_RESET
        value: "false"
  - type: web
    name: roomify-ai-service
    runtime: docker
    plan: free
    rootDir: ai-service
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ROOMIFY_BACKEND_HOST
        fromService:
          type: web
          name: roomify-backend
          property: host
      - key: ROOMIFY_BACKEND_PORT
        fromService:
          type: web
          name: roomify-backend
          property: port
      - key: AI_SERVICE_CORS_ALLOWED_ORIGINS
        value: ""
