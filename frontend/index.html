<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#264B6B" />
    <meta name="background-color" content="#F5F2EA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Roomify" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/roomify-logo.png" />
    <link rel="apple-touch-icon" href="/roomify-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const key = 'roomify.theme';
        const allowed = ['roomify-premium', 'roomify-classic', 'midnight-emerald', 'royal-gold', 'aurora-violet', 'ocean-sapphire', 'sunset-coral', 'alpine-mint', 'rose-quartz', 'graphite-copper'];
        const theme = allowed.includes(localStorage.getItem(key)) ? localStorage.getItem(key) : 'roomify-premium';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Roomify</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
