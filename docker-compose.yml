services:
  postgres:
    image: postgres:16
    container_name: roomify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomify
      POSTGRES_USER: roomify_user
      POSTGRES_PASSWORD: roomify_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - roomify-network
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: roomify-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - roomify-network
  backend:
    build:
      context: ./backend
    container_name: roomify-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev-demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://roomify-postgres:5432/roomify
      SPRING_DATASOURCE_USERNAME: roomify_user
      SPRING_DATASOURCE_PASSWORD: roomify_pass
      SPRING_MAIL_HOST: roomify-mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROTOCOL: smtp
      SPRING_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_STARTTLS_ENABLE: "false"
      ROOMIFY_MAIL_FROM: no-reply@roomify.local
      ROOMIFY_DEMO_BOOTSTRAP_ENABLED: "true"
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_MAPS_DEMO_KEY_MODE: ${GOOGLE_MAPS_DEMO_KEY_MODE:-false}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "12"
      SERVER_PORT: 8080
    depends_on:
      - postgres
      - mailpit
    ports:
      - "8080:8080"
    networks:
      - roomify-network

networks:
  roomify-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
