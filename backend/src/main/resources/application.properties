roomify.notification.max-attempts=${ROOMIFY_NOTIFICATION_MAX_ATTEMPTS:5}
roomify.notification.retry-batch-size=${ROOMIFY_NOTIFICATION_RETRY_BATCH_SIZE:25}
roomify.notification.reminders-batch-size=${ROOMIFY_NOTIFICATION_REMINDERS_BATCH_SIZE:50}
roomify.notification.per-recipient-per-hour-limit=${ROOMIFY_NOTIFICATION_PER_RECIPIENT_PER_HOUR_LIMIT:12}
roomify.notification.per-recipient-per-day-limit=${ROOMIFY_NOTIFICATION_PER_RECIPIENT_PER_DAY_LIMIT:40}
roomify.notification.initial-retry-delay-minutes=${ROOMIFY_NOTIFICATION_INITIAL_RETRY_DELAY_MINUTES:5}
roomify.notification.max-retry-delay-minutes=${ROOMIFY_NOTIFICATION_MAX_RETRY_DELAY_MINUTES:180}
roomify.notification.scheduling-enabled=${ROOMIFY_NOTIFICATION_SCHEDULING_ENABLED:true}

# ── Database Configuration (PostgreSQL) ─────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roomify}
spring.datasource.username=${DB_USERNAME:roomify_user}
spring.datasource.password=${DB_PASSWORD:roomify_pass}

# CHANGED: was "update" — now "validate" so Hibernate never touches the schema.
# Flyway owns all DDL; Hibernate only validates that the entity model matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

# Keep baseline disabled for routine development. Only enable it explicitly for a
# one-time adoption of an existing schema that was not created by Flyway.
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.out-of-order=${SPRING_FLYWAY_OUT_OF_ORDER:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:12}

