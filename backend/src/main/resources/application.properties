spring.application.name=roomify-backend
server.port=${SERVER_PORT:8080}

# ── Mail Configuration (Development Dummy) ──────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:localhost}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:1025}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:test}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:test}}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── Database Configuration (PostgreSQL) ─────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roomify}
spring.datasource.username=${DB_USERNAME:roomify_user}
spring.datasource.password=${DB_PASSWORD:roomify_pass}

# CHANGED: was "update" — now "validate" so Hibernate never touches the schema.
# Flyway owns all DDL; Hibernate only validates that the entity model matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ── JWT Configuration ────────────────────────────────────────────────────────
roomify.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
roomify.jwt.expiration=86400000

# ── Billing ──────────────────────────────────────────────────────────────────
roomify.billing.vat-rate=${ROOMIFY_VAT_RATE:${BILLING_VAT_RATE:0.15}}
roomify.reservations.tax-rate=${roomify.billing.vat-rate}

# ── Demo Bootstrap ───────────────────────────────────────────────────────────
roomify.demo.bootstrap.enabled=${ROOMIFY_DEMO_BOOTSTRAP_ENABLED:false}
roomify.ai-finance.enabled=${ROOMIFY_AI_FINANCE_ENABLED:true}
roomify.ai-finance.demo-seed-enabled=${ROOMIFY_AI_FINANCE_DEMO_SEED_ENABLED:false}
roomify.ai-finance.demo-seed-reset=${ROOMIFY_AI_FINANCE_DEMO_SEED_RESET:false}
roomify.ai-service.base-url=${ROOMIFY_AI_SERVICE_BASE_URL:http://localhost:8000}
roomify.ai-service.timeout-ms=${ROOMIFY_AI_SERVICE_TIMEOUT_MS:3000}
roomify.ai-service.fallback-enabled=${ROOMIFY_AI_SERVICE_FALLBACK_ENABLED:true}
