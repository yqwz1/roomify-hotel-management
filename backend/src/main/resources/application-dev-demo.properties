spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:roomify}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
roomify.mail.reset-base-url=${ROOMIFY_MAIL_RESET_BASE_URL:http://localhost:5173/reset-password}

roomify.demo.bootstrap.enabled=${ROOMIFY_DEMO_BOOTSTRAP_ENABLED:true}
roomify.ai-finance.enabled=${ROOMIFY_AI_FINANCE_ENABLED:true}
roomify.ai-finance.demo-seed-enabled=${ROOMIFY_AI_FINANCE_DEMO_SEED_ENABLED:false}
roomify.ai-finance.demo-seed-reset=${ROOMIFY_AI_FINANCE_DEMO_SEED_RESET:false}
roomify.ai-service.base-url=${ROOMIFY_AI_SERVICE_BASE_URL:http://localhost:8000}
roomify.ai-service.timeout-ms=${ROOMIFY_AI_SERVICE_TIMEOUT_MS:3000}
roomify.ai-service.fallback-enabled=${ROOMIFY_AI_SERVICE_FALLBACK_ENABLED:true}
