# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway for tests — Hibernate owns the schema via create-drop.
# Flyway migrations are PostgreSQL-specific and incomplete (no CREATE TABLE
# for guests, rooms, reservations, room_types), so they cannot run on H2.
spring.flyway.enabled=false

# JWT Configuration
roomify.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
roomify.jwt.expiration=86400000

# Billing
roomify.billing.vat-rate=0.15
roomify.reservations.tax-rate=0.15

# Demo / AI — disabled for tests
roomify.demo.bootstrap.enabled=false
roomify.ai-finance.enabled=false
roomify.ai-finance.demo-seed-enabled=false
roomify.ai-finance.demo-seed-reset=false
roomify.ai-service.base-url=http://localhost:8000
roomify.ai-service.timeout-ms=3000
roomify.ai-service.fallback-enabled=true

# Disable Spring Security for tests (or configure it properly)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
roomify.mail.from=no-reply@test.roomify
roomify.mail.reset-base-url=http://localhost/reset-password
roomify.notification.scheduling-enabled=false
