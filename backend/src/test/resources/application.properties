# ── Test-only application.properties ─────────────────────────────────────────
# This file is on the test classpath and overrides main/resources/application.properties
# for ALL test executions, regardless of active profile.
#
# Rationale: The Flyway migrations are PostgreSQL-specific and structurally
# incomplete (no CREATE TABLE for guests, rooms, reservations, room_types —
# those are Hibernate-managed entities). Tests use ddl-auto=create-drop,
# which means Hibernate owns schema creation. Flyway must be disabled so it
# doesn't try to run migrations against H2 that reference missing tables.
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=roomify-backend

# ── H2 Database (default for tests) ─────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ── Disable Flyway for tests ────────────────────────────────────────────────
spring.flyway.enabled=false

# ── Mail (dummy) ─────────────────────────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=500
spring.mail.properties.mail.smtp.timeout=500
spring.mail.properties.mail.smtp.writetimeout=500
roomify.mail.from=no-reply@test.roomify
roomify.mail.reset-base-url=http://localhost/reset-password
roomify.notification.scheduling-enabled=false

# ── JWT ──────────────────────────────────────────────────────────────────────
roomify.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
roomify.jwt.expiration=86400000

# ── Billing ──────────────────────────────────────────────────────────────────
roomify.billing.vat-rate=0.15
roomify.reservations.tax-rate=0.15

# ── Demo / AI — disabled for tests ──────────────────────────────────────────
roomify.demo.bootstrap.enabled=false
roomify.ai-finance.enabled=false
roomify.ai-finance.demo-seed-enabled=false
roomify.ai-finance.demo-seed-reset=false
roomify.ai-service.base-url=http://localhost:8000
roomify.ai-service.timeout-ms=3000
roomify.ai-service.fallback-enabled=true
